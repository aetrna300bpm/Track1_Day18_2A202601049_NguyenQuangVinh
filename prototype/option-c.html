<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phương án C — VLearn AI Notes</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#15181e; --muted:#6b7280; --line:#e4e7ec;
  --brand:#2f6bff; --brand-soft:#eef3ff; --warn:#b45309; --warn-soft:#fff8ed;
  --ok:#047857; --ok-soft:#ecfdf5; --mark:#fff2b8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:700;letter-spacing:-.2px}
.brand span{color:var(--brand)}
.lesson{color:var(--muted);font-size:13.5px}
.badge{margin-left:auto;background:var(--brand-soft);color:var(--brand);
  font-weight:600;font-size:12.5px;padding:4px 10px;border-radius:99px}
.tbtn{border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px;color:var(--muted);background:#fff}
.tbtn:hover{background:#f3f4f6;color:var(--ink)}
.wrap{max-width:1120px;margin:20px auto 60px;padding:0 20px;
  display:grid;grid-template-columns:1.45fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:16px 18px}
h2{font-size:15px;margin:0 0 2px}
.hint{color:var(--muted);font-size:13px;margin:0}
.stage{background:#171a21;border-radius:14px 14px 0 0;padding:22px 24px 18px;color:#fff}
.slidechip{display:inline-block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#9aa4b8;border:1px solid #333a48;border-radius:6px;padding:2px 8px;margin-bottom:12px}
.slidetitle{font-size:21px;font-weight:700;margin:0 0 14px}
.bul{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;margin:0 -10px}
.bul .dot{color:#7d8aa3;margin-top:1px}
.say{margin-top:16px;border-top:1px solid #2a3040;padding-top:14px}
.saylabel{font-size:11.5px;color:#8b95ab;margin-bottom:6px}
.saytext{padding:9px 11px;margin:0 -11px;border-radius:8px;font-style:italic;color:#e7ebf3}
.bar{background:#20242e;border-radius:0 0 14px 14px;padding:11px 18px;display:flex;align-items:center;gap:14px;
  color:#c3cad8;font-size:13px;flex-wrap:wrap}
.track{flex:1;min-width:120px;height:5px;background:#333a48;border-radius:99px;position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:99px;transition:width .3s}
.play{background:var(--brand);color:#fff;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13.5px}
.play[disabled]{background:#39415a;color:#8b95ab;cursor:default}
.empty{border:1px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--muted);font-size:13.5px}
.cta{width:100%;background:var(--brand);color:#fff;border-radius:10px;padding:12px;font-weight:700;margin-top:12px}
.cta[disabled]{background:#e5e7eb;color:#9ca3af;cursor:default}
.limit{font-size:12.5px;color:var(--muted);margin-top:8px;text-align:center}
.dots::after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
/* ---- draft review (critical interaction của phương án C) ---- */
.note{max-width:820px;margin:20px auto 60px;padding:0 20px}
.banner{background:var(--warn-soft);border:1px solid #f3d19b;color:#7c4a06;border-radius:12px;
  padding:13px 15px;font-size:13.5px;margin-bottom:18px}
.notehead{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.gbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.blk{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:11px;background:#fff}
.blk.dropped{opacity:.45;background:#fafafa}
.blk.infer{border-color:#f3d19b;background:var(--warn-soft)}
.chip{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:99px;margin-bottom:8px;cursor:pointer}
.chip.slide{background:var(--ok-soft);color:var(--ok);border:1px solid #b8e7d3}
.chip.heard{background:#eef6ff;color:#1d4ed8;border:1px solid #c2dbff}
.chip.infer{background:#fff;color:var(--warn);border:1px solid #e2a83f;font-weight:600}
.basis{font-size:12.5px;color:#7c4a06;background:#fff;border:1px dashed #e2a83f;border-radius:8px;padding:9px 11px;margin-top:9px}
.blkbtns{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center}
.b2{border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:13px;background:#fff}
.b2:hover{background:#f3f4f6}
.keep{font-size:12.5px;color:var(--ok);font-weight:600}
.dropmark{font-size:12.5px;color:var(--muted);font-weight:600}
.blk textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;min-height:70px;margin-top:6px}
.noterow{display:flex;gap:8px;margin-top:12px}
.noterow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font:inherit}
.add{background:var(--brand);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px}
.mine{border-left:3px solid var(--brand);padding-left:12px;margin:8px 0;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.ghost{border:1px solid var(--line);border-radius:8px;padding:9px 14px;background:#fff;font-size:13.5px}
.ghost:hover{background:#f3f4f6}
.primary{background:var(--brand);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px}
.primary[disabled]{background:#e5e7eb;color:#9ca3af;cursor:default}
.danger{border:1px solid #f3c2c2;color:#b91c1c;border-radius:8px;padding:9px 14px;background:#fff;font-size:13.5px}
.danger:hover{background:#fef2f2}
.src{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;
  background:var(--ok-soft);color:var(--ok);margin-left:6px;border:1px solid #b8e7d3}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#15181e;color:#fff;
  padding:10px 18px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="top">
  <div class="brand">V<span>Learn</span></div>
  <div class="lesson">Bài 4 — Vector Database &amp; RAG cơ bản</div>
  <div class="badge">Phương án C</div>
  <button class="tbtn" onclick="reset()">Bắt đầu lại</button>
  <a class="tbtn" href="index.html" style="text-decoration:none">Tất cả phương án</a>
</div>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= SHARED FIXTURE (giống hệt ở A, B, C) ================= */
const MOMENTS = [
  { t:"12:40", slide:"Slide 5", title:"Embedding là gì?",
    bullets:["Biểu diễn văn bản thành vector số","Khoảng cách vector ≈ khoảng cách ngữ nghĩa"],
    say:"Chỗ này slide không ghi: embedding model lúc index và lúc query phải giống nhau. Khác model là kết quả ra rác — lỗi này rất hay gặp." },
  { t:"18:05", slide:"Slide 6", title:"Chunking tài liệu",
    bullets:["Cắt tài liệu thành đoạn nhỏ trước khi embed","Kích thước chunk ảnh hưởng chất lượng truy hồi"],
    say:"Kinh nghiệm của mình là chunk 300–500 token, overlap khoảng 15%. Không có con số vàng đâu, phải thử theo tài liệu của các bạn." },
  { t:"24:30", slide:"Slide 7", title:"Vì sao cần re-ranking",
    bullets:["Top-k theo cosine chưa chắc đúng ý người hỏi","Re-ranker chấm lại thứ hạng kết quả"],
    say:"Re-ranking đắt — mỗi query gọi thêm một model nữa. Nếu top-k nhỏ và tài liệu đồng nhất thì bỏ qua cũng được." }
];
const TOTAL = 32;
const MIN = t => parseInt(t.split(":")[0],10) + parseInt(t.split(":")[1],10)/60;

/* ================= CANNED AI DRAFT (chỉ có ở phương án C) ================= */
const DRAFT = [
  { id:0, head:"12:40 — Embedding là gì?", level:"slide", src:"Từ Slide 5",
    text:"Embedding là biểu diễn văn bản thành vector số; khoảng cách giữa hai vector xấp xỉ khoảng cách ngữ nghĩa." },
  { id:1, head:"12:40 — Embedding là gì?", level:"heard", src:"Từ lời giảng 12:40",
    text:"Embedding model dùng lúc index và lúc query phải giống nhau. Khác model thì kết quả truy hồi ra rác — giảng viên nói đây là lỗi hay gặp." },
  { id:2, head:"18:05 — Chunking tài liệu", level:"slide", src:"Từ Slide 6",
    text:"Chunking là cắt tài liệu thành đoạn nhỏ trước khi embed; kích thước chunk ảnh hưởng chất lượng truy hồi." },
  { id:3, head:"18:05 — Chunking tài liệu", level:"heard", src:"Từ lời giảng 18:05",
    text:"Chunk khoảng 300–500 token, overlap ~15%. Giảng viên nhấn: không có con số vàng, phải thử theo tài liệu của mình." },
  { id:4, head:"24:30 — Vì sao cần re-ranking", level:"slide", src:"Từ Slide 7",
    text:"Re-ranker chấm lại thứ hạng kết quả, vì top-k theo cosine chưa chắc đúng ý người hỏi." },
  { id:5, head:"24:30 — Vì sao cần re-ranking", level:"heard", src:"Từ lời giảng 24:30",
    text:"Re-ranking tốn thêm một lần gọi model cho mỗi query; nếu top-k nhỏ và tài liệu đồng nhất thì có thể bỏ qua." },
  { id:6, head:"24:30 — Vì sao cần re-ranking", level:"infer", src:"AI suy ra — hãy kiểm tra",
    text:"Khuyến nghị: hệ thống dưới khoảng 10.000 tài liệu thì nên bỏ re-ranking để tiết kiệm chi phí.",
    basis:"AI dựa trên: giảng viên nói re-ranking đắt và có thể bỏ khi top-k nhỏ, tài liệu đồng nhất. Ngưỡng 10.000 tài liệu KHÔNG có trong bài học — AI tự thêm vào." }
];

/* ================= STATE ================= */
let idx=0, phase="lesson", writing=false, dropped={}, edits={}, editing=null, own=[], saved=false, showBasis={};

function reset(){ idx=0; phase="lesson"; writing=false; dropped={}; edits={}; editing=null; own=[]; saved=false; showBasis={};
  clearTimeout(window._w); render(); }
function toast(m){ const e=document.getElementById("toast"); e.textContent=m; e.classList.add("on");
  clearTimeout(window._tt); window._tt=setTimeout(()=>e.classList.remove("on"),1800); }
function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const txt = b => edits[b.id]!==undefined ? edits[b.id] : b.text;
const kept = () => DRAFT.filter(b=>!dropped[b.id]);

function advance(){
  idx++;
  if(idx>=MOMENTS.length){ writing=true; render();
    window._w=setTimeout(()=>{ writing=false; render(); },1400); return; }
  render();
}
function drop(id){ dropped[id]=true; editing=null; render(); }
function restore(id){ dropped[id]=false; render(); }
function saveEdit(id){ const v=document.getElementById("te"+id).value.trim(); if(v) edits[id]=v; editing=null; render(); toast("Đã sửa."); }
function keepSlideOnly(){ DRAFT.forEach(b=>{ dropped[b.id] = b.level!=="slide"; }); render();
  toast("Chỉ giữ phần lấy từ slide."); }
function dropAll(){ DRAFT.forEach(b=>dropped[b.id]=true); render(); toast("Đã bỏ toàn bộ bản nháp."); }
function restoreAll(){ dropped={}; render(); toast("Đã khôi phục bản nháp."); }
function addOwn(){ const el=document.getElementById("ni"); const v=(el.value||"").trim(); if(!v) return; own.push(v); render(); }
function delOwn(i){ own.splice(i,1); render(); }

/* ================= RENDER ================= */
function render(){
  document.getElementById("app").innerHTML = phase==="lesson" ? lessonView() : draftView();
  const ni=document.getElementById("ni"); if(ni) ni.addEventListener("keydown",e=>{ if(e.key==="Enter") addOwn(); });
}

function lessonView(){
  const ended = idx >= MOMENTS.length;
  const m = MOMENTS[Math.min(idx,MOMENTS.length-1)];
  const now = ended ? TOTAL : MIN(m.t);
  const pct = Math.round(now/TOTAL*100);

  const stage = ended ? `
    <div class="stage" style="text-align:center;padding:56px 24px">
      <div style="font-size:30px;margin-bottom:8px">🎓</div>
      <div style="font-size:19px;font-weight:700">Bài học đã kết thúc</div>
      <div style="color:#9aa4b8;font-size:13.5px;margin-top:6px">Bài 4 · 32 phút · 3 slide đã xem</div>
    </div>`
  : `
    <div class="stage">
      <div class="slidechip">${m.slide}</div>
      <div class="slidetitle">${esc(m.title)}</div>
      ${m.bullets.map(b=>`<div class="bul"><span class="dot">▪</span><span>${esc(b)}</span></div>`).join("")}
      <div class="say">
        <div class="saylabel">GIẢNG VIÊN ĐANG NÓI — không có trên slide</div>
        <div class="saytext">“${esc(m.say)}”</div>
      </div>
    </div>`;

  const panel = ended
    ? (writing
      ? `<div class="card pad"><h2>Ghi chú của tôi</h2>
         <div class="empty" style="margin-top:12px"><span class="dots">AI đang đọc lại slide và lời giảng</span></div></div>`
      : `<div class="card pad"><h2>Ghi chú của tôi</h2>
         <p class="hint" style="margin-bottom:12px">AI đã viết xong bản nháp từ 3 slide và phần giảng viên nói thêm.</p>
         <div class="empty" style="border-style:solid;text-align:left">
           <b>Bản nháp — 7 khối</b><br>4 khối từ slide/lời giảng có nguồn rõ · <span style="color:#b45309;font-weight:600">1 chỗ AI tự suy ra</span><br>
           <span style="font-size:12.5px">Chưa có gì được lưu.</span>
         </div>
         <button class="cta" onclick="phase='draft';render()">Xem &amp; duyệt bản nháp</button>
         <div class="limit">Ghi chú chỉ được lưu khi bạn bấm Lưu.</div></div>`)
    : `<div class="card pad"><h2>Ghi chú của tôi</h2>
       <p class="hint" style="margin-bottom:12px">Bạn không cần làm gì trong lúc học.</p>
       <div class="empty">AI đang theo dõi bài học.<br>Bản nháp ghi chú sẽ xuất hiện khi bài kết thúc.</div>
       <div class="limit">AI đọc slide + lời giảng của bài này. Không ghi nhớ giữa các phiên.</div></div>`;

  return `<div class="wrap">
    <div>
      <div class="card" style="overflow:hidden">
        ${stage}
        <div class="bar">
          <button class="play" ${ended?"disabled":""} onclick="advance()">
            ${ended?"Đã hết bài":"▶ Tiếp tục bài giảng"}
          </button>
          <span>${ended?"32:00":m.t}</span>
          <div class="track"><div class="fill" style="width:${pct}%"></div></div>
          <span>32:00</span>
        </div>
      </div>
      <div class="card pad" style="margin-top:14px">
        ${ended?`<h2>Bài học kết thúc</h2><p class="hint">Sang cột bên phải để xem bản nháp AI đã viết.</p>`
               :`<h2>Đang học</h2><p class="hint">Phương án này không yêu cầu bạn highlight hay gõ gì trong lúc nghe giảng.</p>`}
      </div>
    </div>
    ${panel}
  </div>`;
}

function blockCard(b){
  const isDropped = !!dropped[b.id];
  if(editing===b.id){
    return `<div class="blk ${b.level==="infer"?"infer":""}">
      <span class="chip ${b.level}">${b.src}</span>
      <textarea id="te${b.id}">${esc(txt(b))}</textarea>
      <div class="blkbtns"><button class="b2" onclick="saveEdit(${b.id})">Lưu sửa</button>
      <button class="b2" onclick="editing=null;render()">Hủy</button></div></div>`;
  }
  return `<div class="blk ${isDropped?"dropped":""} ${b.level==="infer"&&!isDropped?"infer":""}">
    <span class="chip ${b.level}" onclick="showBasis[${b.id}]=!showBasis[${b.id}];render()">${b.src}${b.basis?" ⓘ":""}</span>
    <div>${esc(txt(b))}</div>
    ${b.basis&&showBasis[b.id]?`<div class="basis">${esc(b.basis)}</div>`:""}
    <div class="blkbtns">
      ${isDropped
        ? `<span class="dropmark">✕ Đã bỏ</span><button class="b2" onclick="restore(${b.id})">Khôi phục</button>`
        : `<span class="keep">✓ Sẽ lưu</span>
           <button class="b2" onclick="editing=${b.id};render()">Sửa</button>
           <button class="b2" onclick="drop(${b.id})">Bỏ</button>`}
    </div></div>`;
}

function draftView(){
  const k = kept();
  const infersKept = k.filter(b=>b.level==="infer").length;
  if(saved){
    return `<div class="note">
      <div class="notehead"><h1 style="font-size:22px;margin:0 0 4px">Ghi chú — Bài 4 · Vector Database &amp; RAG cơ bản</h1>
      <p class="hint">Đã lưu · ${k.length+own.length} mục</p></div>
      ${k.map(b=>`<div class="blk"><span class="chip ${b.level}">${b.src}</span><div>${esc(txt(b))}</div></div>`).join("")}
      ${own.map(o=>`<div class="mine">${esc(o)}<span class="src">Bạn tự viết</span></div>`).join("")}
      <div class="actions">
        <button class="ghost" onclick="saved=false;render();toast('Đã hoàn tác lưu.')">↩ Hoàn tác lưu</button>
        <button class="ghost" onclick="phase='lesson';render()">← Về bài học</button>
        <button class="ghost" onclick="reset()">Bắt đầu lại</button>
      </div></div>`;
  }
  const heads=[...new Set(DRAFT.map(b=>b.head))];
  return `<div class="note">
    <div class="banner">
      <b>Bản nháp do AI viết từ slide + lời giảng của bài học. Chưa được lưu.</b><br>
      ${infersKept?`Có <b>${infersKept} chỗ AI tự suy ra</b> — bấm vào nhãn vàng để xem AI dựa trên gì.`
                  :`Bạn đã bỏ hết phần AI tự suy ra.`}
    </div>
    <div class="notehead">
      <h1 style="font-size:22px;margin:0 0 4px">Bản nháp ghi chú — Bài 4</h1>
      <p class="hint">Giữ, sửa hoặc bỏ từng khối. Không có gì được lưu cho tới khi bạn bấm Lưu.</p>
    </div>
    <div class="gbtns">
      <button class="ghost" onclick="keepSlideOnly()">Chỉ giữ phần từ slide</button>
      <button class="ghost" onclick="restoreAll()">Khôi phục toàn bộ</button>
      <button class="danger" onclick="dropAll()">Bỏ hết bản nháp, tự viết</button>
    </div>
    ${heads.map(h=>`<h3 style="font-size:13.5px;color:var(--muted);margin:18px 0 8px">${esc(h)}</h3>
      ${DRAFT.filter(b=>b.head===h).map(blockCard).join("")}`).join("")}
    <div class="noterow">
      <input id="ni" placeholder="Tự viết thêm ý của bạn…">
      <button class="add" onclick="addOwn()">Thêm</button>
    </div>
    ${own.map((o,i)=>`<div class="mine">${esc(o)} <button class="b2" style="padding:2px 9px" onclick="delOwn(${i})">Xóa</button></div>`).join("")}
    <div class="actions">
      <button class="primary" ${(k.length+own.length)?"":"disabled"} onclick="saved=true;render();toast('Đã lưu ghi chú.')">
        Lưu ghi chú (${k.length+own.length} mục)</button>
      <button class="ghost" onclick="phase='lesson';render()">← Về bài học</button>
      <button class="ghost" onclick="reset()">Bắt đầu lại</button>
    </div>
  </div>`;
}

render();
</script>
</body>
</html>
