<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phương án D — bản gộp A+B · VLearn AI Notes</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#15181e; --muted:#6b7280; --line:#e4e7ec;
  --brand:#2f6bff; --brand-soft:#eef3ff; --warn:#b45309; --warn-soft:#fff8ed;
  --ok:#047857; --ok-soft:#ecfdf5; --mark:#fff2b8; --markq:#ffd9d9;
  --ai:#6d3ff5; --ai-soft:#f3efff; --ai-line:#d9ccff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
/* ---------- shared header (giống A/B/C) ---------- */
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:700;letter-spacing:-.2px}
.brand span{color:var(--brand)}
.lesson{color:var(--muted);font-size:13.5px}
.badge{margin-left:auto;background:var(--ai-soft);color:var(--ai);border:1px solid var(--ai-line);
  font-weight:600;font-size:12.5px;padding:4px 10px;border-radius:99px}
.tbtn{border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px;color:var(--muted);background:#fff}
.tbtn:hover{background:#f3f4f6;color:var(--ink)}
.wrap{max-width:1120px;margin:20px auto 60px;padding:0 20px;
  display:grid;grid-template-columns:1.45fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:16px 18px}
h2{font-size:15px;margin:0 0 2px}
.hint{color:var(--muted);font-size:13px;margin:0}
/* ---------- player (giống A/B/C) ---------- */
.stage{background:#171a21;border-radius:14px 14px 0 0;padding:22px 24px 18px;color:#fff}
.slidechip{display:inline-block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#9aa4b8;border:1px solid #333a48;border-radius:6px;padding:2px 8px;margin-bottom:12px}
.slidetitle{font-size:21px;font-weight:700;margin:0 0 14px}
.bul{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;margin:0 -10px}
.bul .dot{color:#7d8aa3;margin-top:1px}
.sel{cursor:text}
.say{margin-top:16px;border-top:1px solid #2a3040;padding-top:14px}
.saylabel{font-size:11.5px;color:#8b95ab;margin-bottom:6px}
.saytext{padding:9px 11px;margin:0 -11px;border-radius:8px;font-style:italic;color:#e7ebf3}
mark{background:var(--mark);color:#15181e;border-radius:3px;padding:1px 2px}
mark.q{background:var(--markq)}
.selhint{background:#20242e;color:#9aa4b8;font-size:12.5px;padding:8px 18px;border-top:1px solid #2a3040;
  display:flex;align-items:center;gap:8px}
.selhint b{color:#dbe2ee;font-weight:600}
.bar{background:#20242e;border-radius:0 0 14px 14px;padding:11px 18px;display:flex;align-items:center;gap:14px;
  color:#c3cad8;font-size:13px;flex-wrap:wrap}
.track{flex:1;min-width:120px;height:5px;background:#333a48;border-radius:99px;position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:99px;transition:width .3s}
.play{background:var(--brand);color:#fff;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13.5px}
.play[disabled]{background:#39415a;color:#8b95ab;cursor:default}
/* ---------- floating selection bar (critical interaction) ---------- */
#fab{position:fixed;z-index:60;display:none;gap:6px;background:#15181e;border-radius:10px;padding:5px;
  box-shadow:0 8px 26px rgba(0,0,0,.34)}
#fab.on{display:flex}
#fab button{color:#fff;font-size:13px;padding:6px 11px;border-radius:7px;white-space:nowrap}
#fab button:hover{background:#2c313d}
/* ---------- right panel ---------- */
.noterow{display:flex;gap:8px;margin-top:10px}
.noterow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font:inherit}
.noterow input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.add{background:var(--brand);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px}
.mk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fbfcfd}
.mk .k{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:3px}
.mk .x{margin-left:auto;color:#9ca3af;font-size:16px;line-height:1}
.mk .x:hover{color:#dc2626}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:13.5px}
.cta{width:100%;background:var(--brand);color:#fff;border-radius:10px;padding:12px;font-weight:700;margin-top:12px}
.cta[disabled]{background:#e5e7eb;color:#9ca3af;cursor:default}
.limit{font-size:12.5px;color:var(--muted);margin-top:8px;text-align:center}
/* ---------- note view ---------- */
.note{max-width:820px;margin:20px auto 60px;padding:0 20px}
.banner{background:var(--ai-soft);border:1px solid var(--ai-line);color:#4a2ba8;border-radius:12px;
  padding:13px 15px;font-size:13.5px;margin-bottom:18px}
.notehead{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.gbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.grp{font-size:13.5px;color:var(--muted);margin:20px 0 8px;font-weight:600}
.item{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:11px;background:#fff}
.mine{font-size:15.5px}
.mine .tag{font-size:11.5px;color:var(--muted);margin-right:6px}
.src{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;
  background:var(--ok-soft);color:var(--ok);margin-left:6px;border:1px solid #b8e7d3}
.askai{margin-top:10px;border:1px solid var(--ai-line);color:var(--ai);background:var(--ai-soft);
  border-radius:8px;padding:6px 13px;font-size:13px;font-weight:600}
.askai:hover{background:#eae2ff}
.askai[disabled]{opacity:.55;cursor:default}
.toggle{margin-top:10px;display:flex;align-items:center;gap:7px;color:var(--ai);font-size:13px;font-weight:600;
  border:1px solid var(--ai-line);background:var(--ai-soft);border-radius:8px;padding:6px 12px}
.exp{margin-top:9px;border-left:3px solid var(--ai-line);background:var(--ai-soft);border-radius:0 10px 10px 0;
  padding:12px 14px;font-size:14px}
.exp .who{font-size:11.5px;color:var(--ai);font-weight:700;letter-spacing:.04em;margin-bottom:6px}
.addedchip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;margin-left:6px;
  background:#fff;color:var(--warn);border:1px solid #e2a83f;font-weight:600}
.expbtns{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.b2{border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:13px;background:#fff}
.b2:hover{background:#f3f4f6}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.ghost{border:1px solid var(--line);border-radius:8px;padding:9px 14px;background:#fff;font-size:13.5px}
.ghost:hover{background:#f3f4f6}
.ghost[disabled]{opacity:.45;cursor:default;background:#fff}
.primary{background:var(--brand);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px}
.danger{border:1px solid #f3c2c2;color:#b91c1c;border-radius:8px;padding:9px 14px;background:#fff;font-size:13.5px}
.danger:hover{background:#fef2f2}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#15181e;color:#fff;
  padding:10px 18px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:70}
.toast.on{opacity:1}
.dots::after{content:"";animation:dots 1.1s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
</style>
</head>
<body>

<div class="top">
  <div class="brand">V<span>Learn</span></div>
  <div class="lesson">Bài 4 — Vector Database &amp; RAG cơ bản</div>
  <div class="badge">Phương án D · bản gộp A+B</div>
  <button class="tbtn" onclick="reset()">Bắt đầu lại</button>
  <a class="tbtn" href="../prototype/index.html" style="text-decoration:none">Về bộ A/B/C</a>
</div>

<div id="app"></div>
<div id="fab"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= SHARED FIXTURE — giống hệt A, B, C ================= */
const MOMENTS = [
  { t:"12:40", slide:"Slide 5", title:"Embedding là gì?",
    bullets:[{id:"s5b0",text:"Biểu diễn văn bản thành vector số"},
             {id:"s5b1",text:"Khoảng cách vector ≈ khoảng cách ngữ nghĩa"}],
    say:{id:"s5say",text:"Chỗ này slide không ghi: embedding model lúc index và lúc query phải giống nhau. Khác model là kết quả ra rác — lỗi này rất hay gặp."} },
  { t:"18:05", slide:"Slide 6", title:"Chunking tài liệu",
    bullets:[{id:"s6b0",text:"Cắt tài liệu thành đoạn nhỏ trước khi embed"},
             {id:"s6b1",text:"Kích thước chunk ảnh hưởng chất lượng truy hồi"}],
    say:{id:"s6say",text:"Kinh nghiệm của mình là chunk 300–500 token, overlap khoảng 15%. Không có con số vàng đâu, phải thử theo tài liệu của các bạn."} },
  { t:"24:30", slide:"Slide 7", title:"Vì sao cần re-ranking",
    bullets:[{id:"s7b0",text:"Top-k theo cosine chưa chắc đúng ý người hỏi"},
             {id:"s7b1",text:"Re-ranker chấm lại thứ hạng kết quả"}],
    say:{id:"s7say",text:"Re-ranking đắt — mỗi query gọi thêm một model nữa. Nếu top-k nhỏ và tài liệu đồng nhất thì bỏ qua cũng được."} }
];
const TOTAL = 32;
const MIN = t => parseInt(t.split(":")[0],10) + parseInt(t.split(":")[1],10)/60;
const SRCLABEL = { s5b0:"Slide 5", s5b1:"Slide 5", s5say:"Lời giảng 12:40",
                   s6b0:"Slide 6", s6b1:"Slide 6", s6say:"Lời giảng 18:05",
                   s7b0:"Slide 7", s7b1:"Slide 7", s7say:"Lời giảng 24:30",
                   own0:"Bạn tự viết · 12:40", own1:"Bạn tự viết · 18:05", own2:"Bạn tự viết · 24:30" };

/* ====== CANNED AI ELABORATION — chỉ chạy khi user bấm "Làm rõ giúp tôi" ====== */
const ELAB = {
  s5b0:{ src:"Slide 5",
    text:"Mỗi đoạn văn bản được một embedding model chuyển thành một dãy số (thường 384–1536 chiều). Máy không so chữ với chữ, mà so hai dãy số này. Vì vậy chất lượng của cả hệ thống phụ thuộc vào model sinh ra dãy số đó." },
  s5b1:{ src:"Slide 5",
    text:"Hai câu có nghĩa gần nhau sẽ cho hai vector nằm gần nhau trong không gian, nên có thể tìm được tài liệu liên quan mà không cần trùng từ khoá. Độ 'gần' thường đo bằng cosine similarity.",
    added:"Tên gọi cosine similarity không có trong bài — AI thêm vào." },
  s5say:{ src:"Lời giảng 12:40",
    text:"Nếu lúc dựng index dùng model X mà lúc truy vấn dùng model Y, hai vector nằm ở hai không gian khác nhau nên khoảng cách giữa chúng vô nghĩa. Hệ thống vẫn chạy và không báo lỗi — nó chỉ trả về kết quả sai. Đó là lý do giảng viên gọi đây là lỗi rất hay gặp." },
  s6b0:{ src:"Slide 6",
    text:"Một tài liệu dài không embed nguyên khối được: model có giới hạn độ dài đầu vào, và một vector cho cả tài liệu sẽ trung bình hoá mất các ý cụ thể. Nên cắt thành chunk rồi embed từng chunk." },
  s6b1:{ src:"Slide 6",
    text:"Chunk quá nhỏ thì mất ngữ cảnh, đoạn lấy ra bị cụt. Chunk quá lớn thì một vector phải gánh nhiều ý khác nhau, độ chính xác khi truy hồi giảm." },
  s6say:{ src:"Lời giảng 18:05",
    text:"Con số cụ thể chỉ có trong lời giảng: 300–500 token mỗi chunk, overlap khoảng 15% để câu bị cắt ngang không mất nghĩa. Giảng viên nhấn đây là điểm khởi đầu để thử, không phải chuẩn cố định." },
  s7b0:{ src:"Slide 7",
    text:"Cosine đo độ gần về mặt biểu diễn, không đo mức độ trả lời được câu hỏi. Một đoạn có thể rất giống câu hỏi về từ ngữ mà vẫn không chứa đáp án." },
  s7b1:{ src:"Slide 7",
    text:"Re-ranker nhận cả câu hỏi lẫn từng đoạn ứng viên rồi chấm điểm mức độ phù hợp, thay vì chỉ so hai vector đã tính sẵn. Nhờ vậy chính xác hơn, nhưng chậm hơn." },
  s7say:{ src:"Lời giảng 24:30",
    text:"Chi phí là lý do chính: re-ranking gọi thêm một model cho mỗi truy vấn nên vừa tốn tiền vừa tăng độ trễ. Giảng viên nói nếu top-k đã nhỏ và tài liệu đồng nhất thì lợi ích không bù được chi phí." },
  own0:{ src:"Slide 5 + Lời giảng 12:40",
    text:"Đoạn bài học tại thời điểm bạn ghi đang nói về embedding: văn bản được chuyển thành vector, khoảng cách vector xấp xỉ khoảng cách ngữ nghĩa, và cảnh báo phải dùng cùng một model lúc index và lúc query." },
  own1:{ src:"Slide 6 + Lời giảng 18:05",
    text:"Đoạn bài học tại thời điểm bạn ghi đang nói về chunking: vì sao phải cắt nhỏ tài liệu trước khi embed, và gợi ý 300–500 token với overlap khoảng 15%." },
  own2:{ src:"Slide 7 + Lời giảng 24:30",
    text:"Đoạn bài học tại thời điểm bạn ghi đang nói về re-ranking: vì sao top-k theo cosine chưa đủ, và khi nào có thể bỏ re-ranking để tiết kiệm chi phí." }
};

/* ================= STATE ================= */
let idx=0, phase="lesson", marks=[], elab={}, opened={}, busy={};
let uid=0;

function reset(){ idx=0; phase="lesson"; marks=[]; elab={}; opened={}; busy={}; uid=0; hideFab(); render(); }
function toast(m){ const e=document.getElementById("toast"); e.textContent=m; e.classList.add("on");
  clearTimeout(window._tt); window._tt=setTimeout(()=>e.classList.remove("on"),1900); }
function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---- highlight rendering: bọc <mark> quanh đúng đoạn user đã bôi đen ---- */
function withMarks(srcId, text){
  const ms = marks.filter(m=>m.src===srcId && m.text);
  if(!ms.length) return esc(text);
  const spans=[];
  ms.forEach(m=>{ const i=text.indexOf(m.text); if(i>-1) spans.push({s:i,e:i+m.text.length,kind:m.kind}); });
  if(!spans.length) return esc(text);
  spans.sort((a,b)=>a.s-b.s || b.e-a.e);
  const merged=[];
  spans.forEach(sp=>{ const last=merged[merged.length-1];
    if(last && sp.s<=last.e){ last.e=Math.max(last.e,sp.e); if(sp.kind==="q") last.kind="q"; }
    else merged.push({s:sp.s,e:sp.e,kind:sp.kind}); });
  let out="",cur=0;
  merged.forEach(sp=>{ out += esc(text.slice(cur,sp.s))
    + '<mark class="'+(sp.kind==="q"?"q":"")+'">' + esc(text.slice(sp.s,sp.e)) + "</mark>"; cur=sp.e; });
  return out + esc(text.slice(cur));
}

/* ---- text selection → floating action bar ---- */
function hideFab(){ const f=document.getElementById("fab"); f.classList.remove("on"); }
function onSelect(){
  const f=document.getElementById("fab");
  const sel=window.getSelection();
  if(!sel || sel.isCollapsed){ hideFab(); return; }
  const txt=sel.toString().trim();
  if(txt.length<2){ hideFab(); return; }
  let node=sel.anchorNode;
  while(node && !(node.dataset && node.dataset.src)) node=node.parentElement;
  if(!node){ hideFab(); return; }
  const srcId=node.dataset.src;
  const full=node.dataset.text;
  const clean = full.indexOf(txt)>-1 ? txt : full;      // bôi qua nhiều dòng → lấy cả dòng
  const r=sel.getRangeAt(0).getBoundingClientRect();
  f.innerHTML = '<button onclick="mark(\'hl\',\''+srcId+'\')">🖍 Đánh dấu</button>'
              + '<button onclick="mark(\'q\',\''+srcId+'\')">❓ Chưa hiểu</button>';
  f.style.left = Math.max(8, Math.min(window.innerWidth-230, r.left + r.width/2 - 110)) + "px";
  f.style.top  = Math.max(8, r.top - 48) + "px";
  f.classList.add("on");
  window._pending = {src:srcId, text:clean};
}
function mark(kind, srcId){
  const p=window._pending;
  if(!p || p.src!==srcId) return;
  const dup = marks.find(m=>m.src===p.src && m.text===p.text);
  if(dup){ dup.kind = kind; } else { marks.push({id:++uid, kind, src:p.src, text:p.text, m:momentOf(p.src)}); }
  window.getSelection().removeAllRanges();
  hideFab(); render();
  toast(kind==="q" ? "Đã đánh dấu Chưa hiểu." : "Đã đánh dấu.");
}
function momentOf(srcId){
  if(srcId.startsWith("own")) return parseInt(srcId.slice(3),10);
  return {s5:0,s6:1,s7:2}[srcId.slice(0,2)];
}
function addOwn(){
  const el=document.getElementById("ni"); const v=(el.value||"").trim(); if(!v) return;
  const m=Math.min(idx,MOMENTS.length-1);
  marks.push({id:++uid, kind:"note", src:"own"+m, text:v, m});
  render();
}
function del(id){ const i=marks.findIndex(m=>m.id===id); if(i>-1) marks.splice(i,1); delete elab[id]; render(); }

/* ---- AI elaboration: chỉ chạy khi được gọi ---- */
function askAI(id){
  const mk=marks.find(m=>m.id===id); if(!mk || elab[id]) return;
  busy[id]=true; render();
  setTimeout(()=>{ delete busy[id]; elab[id]=ELAB[mk.src]||null; opened[id]=true; render(); }, 700);
}
function askAll(){
  const todo=marks.filter(m=>!elab[m.id]);
  if(!todo.length) return;
  todo.forEach(m=>busy[m.id]=true); render();
  setTimeout(()=>{ todo.forEach(m=>{ delete busy[m.id]; elab[m.id]=ELAB[m.src]||null; }); render();
    toast("AI đã làm rõ "+todo.length+" mục. Bấm để mở ra xem."); }, 900);
}
function dropAI(id){ delete elab[id]; delete opened[id]; render(); }
function tog(id){ opened[id]=!opened[id]; render(); }
function shut(id){ opened[id]=false; render(); }
function wipeAll(){ marks=[]; elab={}; opened={}; phase="lesson"; idx=0; render(); toast("Đã xoá hết."); }
function dropAllAI(){ elab={}; opened={}; render(); toast("Đã bỏ toàn bộ phần AI mở rộng."); }

/* ================= RENDER ================= */
function render(){
  document.getElementById("app").innerHTML = phase==="lesson" ? lessonView() : noteView();
  const ni=document.getElementById("ni"); if(ni) ni.addEventListener("keydown",e=>{ if(e.key==="Enter") addOwn(); });
}
document.addEventListener("mouseup", e=>{ if(document.getElementById("fab").contains(e.target)) return; setTimeout(onSelect,0); });
document.addEventListener("keyup", ()=>setTimeout(onSelect,0));
window.addEventListener("scroll", hideFab, true);

function lessonView(){
  const ended = idx >= MOMENTS.length;
  const m = MOMENTS[Math.min(idx,MOMENTS.length-1)];
  const now = ended ? TOTAL : MIN(m.t);
  const pct = Math.round(now/TOTAL*100);

  const stage = ended ? `
    <div class="stage" style="text-align:center;padding:56px 24px">
      <div style="font-size:30px;margin-bottom:8px">🎓</div>
      <div style="font-size:19px;font-weight:700">Bài học đã kết thúc</div>
      <div style="color:#9aa4b8;font-size:13.5px;margin-top:6px">Bài 4 · 32 phút · 3 slide đã xem</div>
    </div>`
  : `
    <div class="stage">
      <div class="slidechip">${m.slide}</div>
      <div class="slidetitle">${esc(m.title)}</div>
      ${m.bullets.map(b=>`
        <div class="bul"><span class="dot">▪</span>
          <span class="sel" data-src="${b.id}" data-text="${esc(b.text)}">${withMarks(b.id,b.text)}</span>
        </div>`).join("")}
      <div class="say">
        <div class="saylabel">GIẢNG VIÊN ĐANG NÓI — không có trên slide</div>
        <div class="saytext sel" data-src="${m.say.id}" data-text="${esc(m.say.text)}">“${withMarks(m.say.id,m.say.text)}”</div>
      </div>
    </div>`;

  const marksPanel = marks.length
    ? marks.map(k=>`<div class="mk">
        <div class="k"><span>${k.kind==="hl"?"🖍 Đánh dấu":k.kind==="q"?"❓ Chưa hiểu":"✍️ Bạn tự viết"}</span>
          <span>·</span><span>${SRCLABEL[k.src]}</span>
          <button class="x" title="Xoá" onclick="del(${k.id})">×</button></div>
        <div>${esc(k.text)}</div></div>`).join("")
    : `<div class="empty">Chưa có dấu nào.<br>AI sẽ không tạo ra ghi chú nào.</div>`;

  return `<div class="wrap">
    <div>
      <div class="card" style="overflow:hidden">
        ${stage}
        ${ended?"":`<div class="selhint">🖍 <b>Bôi đen</b> bất kỳ đoạn chữ nào ở trên để đánh dấu hoặc gắn cờ “Chưa hiểu”.</div>`}
        <div class="bar">
          <button class="play" ${ended?"disabled":""} onclick="idx++;hideFab();render()">
            ${ended?"Đã hết bài":"▶ Tiếp tục bài giảng"}
          </button>
          <span>${ended?"32:00":m.t}</span>
          <div class="track"><div class="fill" style="width:${pct}%"></div></div>
          <span>32:00</span>
        </div>
      </div>
      <div class="card pad" style="margin-top:14px">
        ${ended
          ? `<h2>Bài học kết thúc</h2><p class="hint">Sang cột bên phải để mở ghi chú của bạn.</p>`
          : `<h2>Tự viết thêm</h2>
             <p class="hint">Ghi nhanh ý của bạn tại ${m.t} — không cần đúng chính tả.</p>
             <div class="noterow">
               <input id="ni" placeholder="Ghi chú / câu hỏi ngắn tại ${m.t}…">
               <button class="add" onclick="addOwn()">Thêm</button>
             </div>`}
      </div>
    </div>
    <div class="card pad">
      <h2>Dấu của bạn (${marks.length})</h2>
      <p class="hint" style="margin-bottom:12px">AI đang im lặng. Nó chỉ viết khi bạn yêu cầu, ở cuối bài.</p>
      ${marksPanel}
      <button class="cta" ${marks.length?"":"disabled"} onclick="phase='note';hideFab();render()">
        Mở ghi chú của tôi (${marks.length} mục)
      </button>
      <div class="limit">Ghi chú chỉ gồm những gì bạn đánh dấu hoặc tự viết.</div>
    </div>
  </div>`;
}

function noteView(){
  const groups = MOMENTS.map((m,i)=>({m, items:marks.filter(k=>k.m===i)})).filter(g=>g.items.length);
  const nElab = marks.filter(m=>elab[m.id]).length;
  const nTodo = marks.filter(m=>!elab[m.id]).length;

  const itemHtml = k => {
    const e = elab[k.id];
    return `<div class="item">
      <div class="mine"><span class="tag">${k.kind==="hl"?"🖍":k.kind==="q"?"❓":"✍️"}</span>${esc(k.text)}<span class="src">${SRCLABEL[k.src]}</span></div>
      ${busy[k.id] ? `<div class="askai" style="display:inline-block"><span class="dots">AI đang làm rõ</span></div>` : ""}
      ${(!e && !busy[k.id]) ? `<button class="askai" onclick="askAI(${k.id})">✨ Làm rõ giúp tôi</button>` : ""}
      ${e ? `<button class="toggle" onclick="tog(${k.id})">
                ${opened[k.id]?"▾":"▸"} AI đã làm rõ · ${e.src}</button>` : ""}
      ${(e && opened[k.id]) ? `<div class="exp">
          <div class="who">AI MỞ RỘNG — KHÔNG PHẢI CHỮ CỦA BẠN</div>
          ${esc(e.text)}${e.added?`<span class="addedchip">AI thêm — không có trong bài</span>
          <div style="font-size:12.5px;color:#7c4a06;margin-top:7px">${esc(e.added)}</div>`:""}
          <div class="expbtns">
            <button class="b2" onclick="shut(${k.id})">Thu gọn</button>
            <button class="b2" onclick="dropAI(${k.id})">Bỏ phần AI này</button>
          </div></div>` : ""}
    </div>`;
  };

  return `<div class="note">
    <div class="banner">
      <b>Ghi chú này là của bạn. AI chưa viết gì cả.</b><br>
      Bấm <b>“Làm rõ giúp tôi”</b> ở mục nào bạn muốn AI mở rộng. Phần AI luôn nằm tách bên dưới chữ của bạn và bỏ được bất cứ lúc nào.
    </div>
    <div class="notehead">
      <h1 style="font-size:22px;margin:0 0 4px">Ghi chú — Bài 4 · Vector Database &amp; RAG cơ bản</h1>
      <p class="hint">${marks.length} mục bạn đánh dấu hoặc tự viết${nElab?` · ${nElab} mục đã nhờ AI làm rõ`:""}</p>
    </div>
    <div class="gbtns">
      <button class="ghost" ${nTodo?"":"disabled"} onclick="askAll()">✨ Làm rõ tất cả (${nTodo} mục)</button>
      ${nElab?`<button class="danger" onclick="dropAllAI()">Bỏ hết phần AI mở rộng</button>`:""}
    </div>
    ${groups.map(g=>`<div class="grp">${g.m.t} — ${esc(g.m.title)}</div>${g.items.map(itemHtml).join("")}`).join("")}
    <div class="actions">
      <button class="primary" onclick="toast('Đã lưu ghi chú.')">Lưu ghi chú</button>
      <button class="ghost" onclick="phase='lesson';render()">← Về bài học để đánh dấu thêm</button>
      <button class="ghost" onclick="wipeAll()">Xoá hết và tự viết</button>
      <button class="ghost" onclick="reset()">Bắt đầu lại</button>
    </div>
  </div>`;
}

render();
</script>
</body>
</html>
